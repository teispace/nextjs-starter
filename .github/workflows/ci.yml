name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Biome (lint + format + import sort)
        run: yarn ci:check

      - name: Type check
        run: yarn type-check

      - name: Deprecated API scan
        run: yarn check:deprecated

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build
